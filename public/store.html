<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market — astraOS</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="wrap" id="main"><p class="muted" style="padding:60px 0">Loading…</p></main>
<script type="module">
import { api, esc, size, ago, bar, foot } from "/site.js";
bar("market");
const pkg = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "");
const main = document.getElementById("main");
try {
  const a = await api("GET", `/api/store/apps/${encodeURIComponent(pkg)}`);
  document.title = `${a.name} — Market`;
  const shots = a.screenshots || [];
  main.innerHTML = `
    <div class="appHead">
      <img class="ic" src="${esc(a.icon || "/assets/grid.svg")}" alt="">
      <div style="flex:1;min-width:240px">
        <h1>${esc(a.name)}</h1>
        <div class="muted">${esc(a.developer)}</div>
        <p class="muted" style="margin:8px 0 14px">${esc(a.summary || "")}</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${(a.variants || []).length ? a.variants.map((v) => `<a class="btn${v.target === a.target ? "" : " soft"}" href="${esc(v.url)}">Download for ${v.target === "desktop" ? "desktop" : "phone"}</a>`).join("") : `<a class="btn" href="${esc(a.url)}">Download</a>`}
          ${a.website ? `<a class="btn soft" href="${esc(a.website)}" rel="noopener">Website</a>` : ""}
        </div>
      </div>
    </div>
    <div class="facts">
      <div><b>${esc(a.category)}</b><span>Category</span></div>
      <div><b>${esc(a.version)}</b><span>Version</span></div>
      <div><b>${(a.targets || ["mobile"]).map((t) => t === "desktop" ? "Desktop" : "Phone").join(" · ")}</b><span>Runs on</span></div>
      <div><b>${size(a.size)}</b><span>Size</span></div>
      <div><b>${a.downloads}</b><span>Downloads</span></div>
    </div>
    ${shots.length ? `<section class="block"><div class="shots">${shots.map((s) => `<img src="${esc(s)}" alt="" loading="lazy">`).join("")}</div></section>` : ""}
    <section class="block"><h2>About</h2><p class="muted" style="white-space:pre-wrap;max-width:760px">${esc(a.description || a.summary)}</p></section>
    <section class="block"><h2>How to install</h2>
      <div class="panel how"><div class="num">1</div><div><b>On your phone or computer</b><br><span class="muted">Open Market, find ${esc(a.name)} and tap Get: this page is the same on both, and each gets its own version${(a.targets || []).length === 1 && a.targets[0] === "desktop" ? " (this app is for astraOS Desktop only)" : (a.targets || []).length === 1 ? " (on a computer it opens in a window shaped like a phone)" : ""}.</span></div></div>
      <div class="panel how" style="margin-top:10px"><div class="num">2</div><div><b>Or from a file</b><br><span class="muted">Download the package above, then open it with Files on your astraOS phone.</span></div></div>
    </section>
    <section class="block"><h2>What's new</h2><div class="panel versions">${a.versions.map((v) => `
      <div class="row"><b>${esc(v.version)}</b> <span class="small">${ago(v.created)} · ${size(v.size)}</span><br>
      <span class="muted" style="font-size:14.5px">${esc(v.notes || "Improvements and fixes.")}</span></div>`).join("")}</div></section>`;
} catch (e) {
  main.innerHTML = `<div class="auth"><div class="panel"><h2>App not found</h2><p class="muted">It may have been removed from Market.</p><a class="btn" href="/">See all apps</a></div></div>`;
}
foot();
</script>
</body>
</html>
